<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Khang - Người bạn đặc biệt ✨</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --bg-gradient: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #ff7675 100%);
            --text-color: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBg 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Container chính với hiệu ứng Glassmorphism */
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 0.5s ease;
            position: relative;
        }

        /* Ẩn các trang mặc định */
        .page {
            display: none;
            width: 100%;
            animation: fadeIn 0.6s ease forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tiêu đề và Văn bản */
        h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 24px;
        }

        .typewriter-text {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-color);
            font-weight: 500;
            min-height: 60px;
            margin-bottom: 25px;
            white-space: pre-line;
        }

        /* Hiệu ứng nhấp nháy con trỏ chuột khi đánh máy */
        .cursor {
            display: inline-block;
            width: 3px;
            background-color: var(--primary-color);
            animation: blink 0.7s infinite;
            margin-left: 3px;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* Cấu trúc Form */
        .input-group {
            width: 100%;
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.9);
        }

        input:focus, textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.2);
        }

        textarea {
            resize: none;
            height: 110px;
        }

        /* Nút bấm thiết kế mượt */
        button {
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: #b2bec3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-msg {
            color: #d63031;
            font-size: 14px;
            margin-top: 8px;
            display: none;
            font-weight: 500;
        }

        /* Trang cuối cùng thành công */
        .success-content {
            display: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- TRANG NHẬP MÃ BẢO MẬT -->
        <div id="page-auth" class="page active">
            <h2>Mã xác nhận 🔑</h2>
            <p style="margin-bottom: 20px; color: #636e72;">Vui lòng nhập mã để mở món quà bí mật từ bạn của cậu.</p>
            <div class="input-group">
                <input type="password" id="secret-code" placeholder="Nhập mã vào đây..." autocomplete="off">
                <div id="auth-error" class="error-msg">Mã chưa đúng rồi cậu ơi! 😢</div>
            </div>
            <button onclick="verifyCode()">Mở quà 🎁</button>
        </div>

        <!-- TRANG 1 -->
        <div id="page-1" class="page">
            <h2>Gửi Khang 👋</h2>
            <div class="typewriter-text" id="text-1"></div>
            <button onclick="nextPage(2)" id="btn-1" style="display: none;">Tiếp theo ✨</button>
        </div>

        <!-- TRANG 2 -->
        <div id="page-2" class="page">
            <h2>Gửi Khang ❤️</h2>
            <div class="typewriter-text" id="text-2"></div>
            <button onclick="nextPage(3)" id="btn-2" style="display: none;">Tiếp theo ✨</button>
        </div>

        <!-- TRANG 3 -->
        <div id="page-3" class="page">
            <h2>Gửi Khang 🌸</h2>
            <div class="typewriter-text" id="text-3"></div>
            <button onclick="nextPage(4)" id="btn-3" style="display: none;">Tiếp theo ✨</button>
        </div>

        <!-- TRANG 4: NHẬP CẢM NHẬN (SỬ DỤNG WEB3FORMS) -->
        <div id="page-4" class="page">
            <h2>Gửi Khang 💭</h2>
            <div class="typewriter-text" id="text-4"></div>
            
            <!-- Form gửi dữ liệu ngầm không reload trang -->
            <form id="web3forms-form" onsubmit="submitForm(event)">
                <!-- Access Key từ code mẫu của bạn -->
                <input type="hidden" name="access_key" value="583ce542-0889-45bf-9d44-2b18a4127614">
                <!-- Tên mặc định để bạn biết đây là tin nhắn từ Khang -->
                <input type="hidden" name="from_name" value="Khang (Bạn học 9 năm)">
                
                <div class="input-group">
                    <textarea name="message" id="feedback-input" placeholder="Nhập nội dung lời nhắn tại đây..." required></textarea>
                </div>
                <button type="submit" id="send-btn">Xong 🚀</button>
            </form>
        </div>

        <!-- TRANG KẾT THÚC CẢM ƠN -->
        <div id="page-success" class="success-content">
            <h1 style="color: #6c5ce7; font-size: 32px; margin-bottom: 10px;">Cảm ơn cậu! 🥰</h1>
            <p style="color: #636e72; font-size: 16px;">Lời nhắn của cậu đã được gửi đi thành công rồi đấy! 🤝🌟</p>
        </div>

    </div>

    <script>
        const CORRECT_CODE = "626573746672";

        // Văn bản đi kèm Emoji phù hợp cuối chuỗi
        const contentPages = {
            1: "Món quà này là gửi cho người bạn học cùng lớp 9 năm 🎓🎒",
            2: "Cảm ơn cậu đã luôn đồng hành cùng mình trên cả chặng đường học tập, cảm ơn vì những lần cậu chỉ bài cho tớ. Cảm ơn cậu vì những mẹo hay khi làm bài 📚✍️",
            3: "Món quà dành tặng cho cậu. Hy vọng rằng chúng ta sẽ tiếp tục làm bạn với nhau nhé! 🌟🤝",
            4: "Cho mình biết bạn nghĩ sao về mình 🤔💬"
        };

        // Xác thực mã bảo mật đầu trang
        function verifyCode() {
            const codeInput = document.getElementById("secret-code").value.trim();
            const errorMsg = document.getElementById("auth-error");

            if (codeInput === CORRECT_CODE) {
                document.getElementById("page-auth").classList.remove("active");
                nextPage(1);
            } else {
                errorMsg.style.display = "block";
                document.getElementById("secret-code").focus();
            }
        }

        // Nhấn Enter để xác nhận mã nhanh
        document.getElementById("secret-code").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                verifyCode();
            }
        });

        // Chuyển trang và kích hoạt hiệu ứng gõ chữ
        function nextPage(pageNum) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            
            const currentPage = document.getElementById(`page-${pageNum}`);
            currentPage.classList.add('active');

            typeWriter(contentPages[pageNum], `text-${pageNum}`, () => {
                if (pageNum === 4) {
                    document.getElementById("web3forms-form").style.opacity = "0";
                    document.getElementById("web3forms-form").style.display = "block";
                    // Hiệu ứng fade in nhẹ cho form sau khi gõ xong chữ
                    setTimeout(() => {
                        document.getElementById("web3forms-form").style.transition = "opacity 0.5s";
                        document.getElementById("web3forms-form").style.opacity = "1";
                    }, 50);
                } else {
                    document.getElementById(`btn-${pageNum}`).style.display = "inline-flex";
                }
            });
        }

        // Hàm xử lý hiệu ứng gõ chữ
        function typeWriter(text, elementId, callback) {
            const element = document.getElementById(elementId);
            element.innerHTML = '<span class="cursor"></span>'; 
            
            let i = 0;
            const speed = 45; 

            function type() {
                if (i < text.length) {
                    element.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
                    i++;
                    setTimeout(type, speed);
                } else {
                    if (callback) callback();
                }
            }
            type();
        }

        // Xử lý gửi Form bằng AJAX để tránh reload trang mất mượt
        async function submitForm(event) {
            event.preventDefault(); // Chặn hành vi tải lại trang mặc định của thẻ form
            
            const form = document.getElementById("web3forms-form");
            const sendBtn = document.getElementById("send-btn");
            const formData = new FormData(form);

            // Chuyển trạng thái nút bấm
            sendBtn.disabled = true;
            sendBtn.innerText = "... ⏳";

            try {
                const response = await fetch("https://api.web3forms.com/submit", {
                    method: "POST",
                    body: formData
                });

                if (response.ok) {
                    // Ẩn trang 4 và hiện màn hình Cảm ơn cậu!
                    document.getElementById("page-4").classList.remove("active");
                    document.getElementById("page-success").style.display = "block";
                } else {
                    alert("Có lỗi xảy ra khi gửi tin nhắn, cậu thử lại nhé!");
                    sendBtn.disabled = false;
                    sendBtn.innerText = "Xong 🚀";
                }
            } catch (error) {
                alert("Không thể kết nối Internet để gửi lời nhắn!");
                sendBtn.disabled = false;
                sendBtn.innerText = "Xong 🚀";
                console.error(error);
            }
        }
    </script>
</body>
</html>
