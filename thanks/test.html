<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cảm Ơn Bạn!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a; /* Màu nền tối để hiệu ứng nổi bật */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            cursor: pointer;
        }

        /* Khối chữ Cảm Ơn */
        .thank-you-text {
            color: #ffffff;
            font-size: 5rem;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            z-index: 10;
            transition: transform 0.2s ease;
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        .thank-you-text:hover {
            transform: scale(1.05);
            text-shadow: 0 0 30px rgba(236, 72, 153, 0.6);
        }

        /* Hiệu ứng chữ bay bổng nhẹ nhàng */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Canvas để vẽ hiệu ứng click */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Để không cản trở sự kiện click */
            z-index: 1;
        }
    </style>
</head>
<body>

    <h1 class="thank-you-text">Cảm ơn!</h1>
    <canvas id="effectCanvas"></canvas>

    <script>
        const canvas = document.getElementById('effectCanvas');
        const ctx = canvas.getContext('2d');

        // Tự động điều chỉnh kích thước canvas theo màn hình
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Mảng chứa các hạt hiệu ứng
        let particles = [];

        // Lớp khởi tạo một hạt (particle)
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                // Kích thước ngẫu nhiên từ 3 đến 8px
                this.size = Math.random() * 5 + 3;
                // Tốc độ và hướng bay ngẫu nhiên theo mọi hướng
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.speedX = Math.cos(angle) * speed;
                this.speedY = Math.sin(angle) * speed;
                // Màu sắc ngẫu nhiên rực rỡ (HSL)
                this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                // Độ mờ và tốc độ biến mất
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                // Thêm chút trọng lực cho hạt rơi xuống nhẹ nhàng
                this.speedY += 0.05; 
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Tạo hiệu ứng nổ hạt khi click
        function createBurst(x, y) {
            // Mỗi lần click tạo ra 40 hạt
            const count = 40;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y));
            }
        }

        // Lắng nghe sự kiện click trên toàn bộ màn hình
        window.addEventListener('click', (e) => {
            createBurst(e.clientX, e.clientY);
        });

        // Hỗ trợ cả thiết bị di động (chạm màn hình)
        window.addEventListener('touchstart', (e) => {
            createBurst(e.touches[0].clientX, e.touches[0].clientY);
        });

        // Vòng lặp hoạt ảnh (Animation Loop)
        function animate() {
            // Xóa canvas cũ nhưng giữ lại một chút bóng mờ (trail effect)
            ctx.fillStyle = 'rgba(15, 23, 42, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Cập nhật và vẽ từng hạt
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                // Xóa hạt nếu nó đã mờ hẳn
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // Bắt đầu chạy hiệu ứng nền
        animate();
    </script>
</body>
</html>
